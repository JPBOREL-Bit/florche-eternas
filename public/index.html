<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Florche.Eternas</title>
<meta name="description" content="Flores de cinta de raso hechas a mano.">
<meta name="theme-color" content="#A23B72">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/store.css">
</head>
<body>
<div class="stick">
  <div class="ann" id="ann" hidden></div>
  <header class="top" id="top"></header>
</div>

<main>
  <section class="hero" id="hero"></section>

  <section class="catalog" id="catalogo">
    <div class="wrap">
      <h2 class="sec-title">Catálogo</h2>
      <div class="cats" id="cats" role="tablist" aria-label="Categorías"></div>
      <div class="grid" id="grid" aria-live="polite"></div>
    </div>
  </section>

  <section class="about" id="about"></section>
</main>

<footer class="foot" id="foot"></footer>

<!-- Ficha de producto -->
<div class="overlay" id="sheetOverlay" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Producto" hidden></div>

<!-- Carrito -->
<div class="overlay" id="cartOverlay" hidden></div>
<aside class="drawer" id="drawer" aria-label="Carrito" hidden></aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/js/pricing.js"></script>
<script src="/js/store.js"></script>
</body>
</html>
