<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel · Florche.Eternas</title>
<style>
:root { --p:#A23B72; --p-dark:#7a2b56; --p-soft:#f7e9f1; --bg:#F7F3F6; --ink:#2b1726; --muted:#7a6872; --line:#e5d8e0; --bad:#B3261E; --ok:#2f7a54; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:400 15px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
button,input,select,textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
[hidden] { display:none !important; }
h1,h2,h3 { margin:0; }
.btn { border:0; border-radius:10px; padding:10px 16px; font-weight:600; background:var(--p); color:#fff; }
.btn:hover { background:var(--p-dark); }
.btn.sec { background:#fff; color:var(--p-dark); border:1.5px solid var(--line); }
.btn.sec:hover { background:var(--p-soft); }
.btn.danger { background:#fff; color:var(--bad); border:1.5px solid #f0c9c6; }
.btn.sm { padding:6px 10px; font-size:.85rem; border-radius:8px; }
.btn[disabled] { opacity:.5; pointer-events:none; }
input[type=text],input[type=number],input[type=password],input[type=tel],select,textarea {
  width:100%; border:1.5px solid var(--line); border-radius:9px; padding:9px 11px; background:#fff;
}
textarea { resize:vertical; min-height:80px; }
label.l { display:block; font-weight:600; font-size:.85rem; margin:0 0 4px; }
.hint { color:var(--muted); font-size:.82rem; margin:4px 0 0; }
.field { margin-bottom:14px; }
.card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
.row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:600px){ .grid2 { grid-template-columns:1fr; } }

/* Login */
.login { max-width:380px; margin:12vh auto; padding:0 16px; }
.login .card { padding:24px; }
.login h1 { font-size:1.4rem; margin-bottom:4px; }
.err { color:var(--bad); font-size:.9rem; margin-top:8px; }

/* App */
.bar { position:sticky; top:0; z-index:20; background:#fff; border-bottom:1px solid var(--line); }
.bar-top { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 16px; }
.bar-top h1 { font-size:1.05rem; }
.tabs { display:flex; gap:4px; padding:0 12px; overflow-x:auto; }
.tab { border:0; background:none; padding:10px 14px; font-weight:600; color:var(--muted); border-bottom:3px solid transparent; white-space:nowrap; }
.tab[aria-selected=true] { color:var(--p-dark); border-bottom-color:var(--p); }
main { max-width:900px; margin:0 auto; padding:16px; }
.head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.head h2 { font-size:1.25rem; }

/* Lista de productos */
.prow { display:flex; align-items:center; gap:12px; padding:10px; background:#fff; border:1px solid var(--line); border-radius:12px; margin-bottom:8px; }
.prow .th { width:56px; height:56px; border-radius:9px; background:#efe5ec; overflow:hidden; flex:none; display:grid; place-items:center; color:#c9b3c1; font-size:1.4rem; }
.prow .th img { width:100%; height:100%; object-fit:cover; }
.prow .info { flex:1; min-width:0; }
.prow .info b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.prow .info small { color:var(--muted); }
.badge { display:inline-block; font-size:.72rem; font-weight:700; padding:2px 8px; border-radius:99px; background:#eee; color:#666; margin-left:6px; }
.badge.ok { background:#e3f3ea; color:var(--ok); }
.acts { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }

/* Modal */
.modal { position:fixed; inset:0; z-index:50; background:rgba(30,10,25,.55); display:flex; align-items:flex-end; justify-content:center; }
@media (min-width:700px){ .modal { align-items:center; } }
.mbox { background:var(--bg); width:min(820px,100%); max-height:94vh; display:flex; flex-direction:column; border-radius:18px 18px 0 0; overflow:hidden; }
@media (min-width:700px){ .mbox { border-radius:18px; } }
.mhead { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; background:#fff; border-bottom:1px solid var(--line); }
.mbody { overflow-y:auto; padding:16px; flex:1; }
.mfoot { display:flex; gap:8px; justify-content:flex-end; padding:12px 16px; background:#fff; border-top:1px solid var(--line); }
.imgs { display:flex; gap:8px; flex-wrap:wrap; }
.imgs .im { position:relative; width:84px; height:84px; border-radius:10px; overflow:hidden; border:2px solid var(--line); }
.imgs .im.main { border-color:var(--p); }
.imgs img { width:100%; height:100%; object-fit:cover; }
.imgs .x { position:absolute; top:3px; right:3px; width:22px; height:22px; border-radius:50%; border:0; background:rgba(255,255,255,.95); font-weight:700; line-height:1; }
.imgs .mk { position:absolute; left:0; right:0; bottom:0; border:0; background:rgba(0,0,0,.55); color:#fff; font-size:.68rem; padding:2px 0; }
.imgs .add { width:84px; height:84px; border-radius:10px; border:2px dashed var(--line); background:#fff; color:var(--muted); font-size:.8rem; }
.gcard { background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
.ghead { display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
.ghead > input { flex:1 1 180px; min-width:0; }
.gbtns { display:flex; gap:4px; flex:none; }
.opt { display:grid; grid-template-columns:34px 1fr 110px 30px; gap:8px; align-items:center; margin-bottom:6px; }
.opt input[type=color] { width:34px; height:34px; padding:0; border:1.5px solid var(--line); border-radius:8px; background:#fff; }
.opt .nocolor { width:34px; height:34px; border:1.5px dashed var(--line); border-radius:8px; background:#fff; color:var(--muted); font-size:.7rem; line-height:1.1; padding:0; }
.opt .price { position:relative; }
.opt .price span { position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:.85rem; pointer-events:none; }
.opt .price input { padding-left:26px; }
.opt .rm { border:0; background:none; color:var(--bad); font-size:1.1rem; }
.opthead { display:grid; grid-template-columns:34px 1fr 110px 30px; gap:8px; font-size:.75rem; color:var(--muted); margin-bottom:4px; }
.chk { display:flex; align-items:center; gap:6px; font-weight:600; font-size:.88rem; }
.chk input { width:18px; height:18px; accent-color:var(--p); }
.note { background:var(--p-soft); border-radius:10px; padding:10px 12px; font-size:.85rem; margin:8px 0 12px; }

/* Tabla de códigos postales */
.tw { overflow-x:auto; background:#fff; border:1px solid var(--line); border-radius:12px; }
table { width:100%; border-collapse:collapse; font-size:.9rem; }
th,td { padding:8px 10px; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle; }
th { font-size:.78rem; color:var(--muted); background:#faf6f9; }
td input[type=number] { width:90px; padding:6px 8px; }
.tag { font-size:.7rem; font-weight:700; padding:2px 7px; border-radius:99px; background:#e8eef9; color:#2d4f8f; }
.tag.man { background:#fff0d6; color:#8a5a00; }
.toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#2b1726; color:#fff; padding:10px 18px; border-radius:99px; z-index:90; opacity:0; pointer-events:none; transition:.25s; max-width:90vw; text-align:center; }
.toast.show { opacity:1; }
.toast.bad { background:var(--bad); }
.logo-prev { max-height:64px; border-radius:8px; border:1px solid var(--line); background:#fff; padding:4px; }

/* ===== Resumen, pedidos, cupones y promos ===== */
.nbadge { display:inline-block; min-width:20px; padding:0 6px; border-radius:99px; background:var(--bad); color:#fff; font-size:.72rem; line-height:20px; text-align:center; margin-left:4px; }
.badge.warn { background:#fff0d6; color:#8a5a00; }
.badge.bad { background:#fbe4e2; color:var(--bad); }
.btn.okb { background:var(--ok); }
.btn.okb:hover { background:#25613f; }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.chipb { border:1.5px solid var(--line); background:#fff; border-radius:99px; padding:6px 13px; font-weight:600; font-size:.85rem; color:var(--muted); }
.chipb.on { background:var(--ink); border-color:var(--ink); color:#fff; }
.ct { font-size:1rem; margin:0 0 12px; }
.card.money { background:linear-gradient(135deg,var(--p),var(--p-dark)); color:#fff; border:0; }
.card.money span { font-size:.85rem; opacity:.85; }
.card.money b { display:block; font-size:2.1rem; line-height:1.2; margin:2px 0; }
.card.money small { opacity:.85; }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
@media (max-width:600px){ .stats { grid-template-columns:repeat(2,1fr); } }
.stat { background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
.stat span { display:block; font-size:.78rem; color:var(--muted); font-weight:600; }
.stat b { display:block; font-size:1.5rem; line-height:1.25; }
.stat small { color:var(--muted); font-size:.76rem; }
.fun { margin-bottom:12px; }
.fl { display:flex; align-items:baseline; gap:8px; font-size:.9rem; margin-bottom:4px; }
.fl span { flex:1; }
.fl em { font-style:normal; color:var(--muted); font-size:.8rem; }
.fb { background:#efe5ec; border-radius:99px; height:10px; overflow:hidden; }
.fb i { display:block; height:100%; background:var(--p); border-radius:99px; }
.chart { width:100%; height:auto; display:block; }
.ocard { background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; }
.ocard.new { border-color:var(--p); box-shadow:0 0 0 3px var(--p-soft); }
.ohead { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
.newtag { background:var(--p); color:#fff; font-size:.68rem; padding:2px 7px; border-radius:99px; margin-right:4px; }
.ometa { color:var(--muted); font-size:.85rem; margin:2px 0; }
.oitems { margin:10px 0; padding-left:18px; }
.oitems li { margin-bottom:6px; }
.oitems .sub { color:var(--muted); font-size:.82rem; }
.oextra { font-size:.85rem; color:var(--ok); margin-bottom:6px; }
.ototal { display:flex; justify-content:space-between; font-size:.95rem; padding:8px 0; border-top:1px dashed var(--line); margin-bottom:8px; }
.ototal b { font-size:1.2rem; }
.code { letter-spacing:.05em; font-size:1.05rem; }
.plist { max-height:200px; overflow-y:auto; border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-top:8px; }
.plist .chk { margin-bottom:6px; }
.trow { display:grid; grid-template-columns:110px 1fr 100px 1fr 28px; gap:8px; align-items:end; margin-bottom:10px; }
@media (max-width:700px){ .trow { grid-template-columns:1fr 1fr; } .trow .rm { justify-self:start; } }
.trow .rm { border:0; background:none; color:var(--bad); font-size:1.3rem; }
.pv { padding:6px 22px 54px 6px; }
.pvt { position:relative; height:8px; background:#efe5ec; border-radius:99px; }
.pvt > i { position:absolute; left:0; top:0; bottom:0; background:var(--p); border-radius:99px; }
.pvm { position:absolute; top:50%; }
.pvm u { position:absolute; left:-7px; top:-7px; width:14px; height:14px; border-radius:50%; background:#fff; border:2px solid var(--p); }
.pvm em { position:absolute; top:14px; left:0; transform:translateX(-50%); width:84px; text-align:center; font-style:normal; font-size:.7rem; color:var(--muted); line-height:1.25; }
.alertbar { position:fixed; top:10px; left:10px; right:10px; z-index:80; max-width:520px; margin:0 auto; background:var(--ink); color:#fff; border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:12px; box-shadow:0 8px 30px rgba(0,0,0,.3); }
.alertbar div { flex:1; min-width:0; }
.alertbar b { display:block; }
.alertbar span { font-size:.88rem; opacity:.9; }
.alertbar .x { border:0; background:none; color:#fff; font-size:1.4rem; line-height:1; }
</style>
</head>
<body>

<!-- LOGIN -->
<section class="login" id="login" hidden>
  <div class="card">
    <h1>Panel de Florche.Eternas</h1>
    <p class="hint" style="margin:0 0 16px">Ingresá con tu contraseña de administradora.</p>
    <div class="field"><label class="l" for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password"></div>
    <button class="btn" id="loginBtn" style="width:100%">Entrar</button>
    <div class="err" id="loginErr"></div>
  </div>
</section>

<!-- APP -->
<div id="app" hidden>
  <div class="bar">
    <div class="bar-top">
      <h1>Panel · <span id="barName">Florche.Eternas</span></h1>
      <div class="row"><a class="btn sec sm" href="/" target="_blank" style="text-decoration:none">Ver tienda</a><button class="btn sec sm" id="logout">Salir</button></div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="dashboard">Resumen</button>
      <button class="tab" role="tab" data-tab="orders">Pedidos <span class="nbadge" id="tabOrdersN" hidden></span></button>
      <button class="tab" role="tab" data-tab="products">Productos</button>
      <button class="tab" role="tab" data-tab="categories">Categorías</button>
      <button class="tab" role="tab" data-tab="coupons">Cupones</button>
      <button class="tab" role="tab" data-tab="promos">Promos</button>
      <button class="tab" role="tab" data-tab="reviews">Reseñas</button>
      <button class="tab" role="tab" data-tab="shipping">Envíos</button>
      <button class="tab" role="tab" data-tab="store">Mi tienda</button>
    </div>
  </div>
  <main id="view"></main>
</div>

<div class="modal" id="modal" hidden></div>
<div class="modal" id="modal2" hidden></div>
<div class="toast" id="toast"></div>

<script src="/js/admin.js"></script>
<script src="/js/admin2.js"></script>
<script src="/js/admin3.js"></script>
</body>
</html>
